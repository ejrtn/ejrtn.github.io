<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Tetris</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f4f5f7;
            font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            color: #222;
            touch-action: manipulation;
            user-select: none;
        }
        h1 { margin: 16px 0 12px; font-size: 28px; letter-spacing: 4px; }
        .game { display: flex; gap: 16px; align-items: flex-start; padding: 0 16px; }
        #board {
            background: #fff;
            border: 2px solid #222;
            display: block;
            width: min(300px, 60vw);
            height: auto;
        }
        .side {
            width: 160px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .box {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px 12px;
        }
        .box h2 { margin: 0 0 6px; font-size: 13px; letter-spacing: 1px; color: #555; }
        .box canvas { display: block; }
        .stat { display: flex; justify-content: space-between; font-size: 14px; margin: 2px 0; }
        .stat b { font-family: Consolas, monospace; font-size: 16px; }
        .controls { font-size: 13px; }
        .controls div { display: flex; margin: 3px 0; }
        .controls kbd {
            min-width: 58px;
            font-family: Consolas, monospace;
            font-weight: bold;
            color: #3b6bff;
        }
        .pad {
            display: none;
            grid-template-columns: repeat(4, 64px);
            gap: 8px;
            margin: 16px 0;
        }
        .pad button {
            height: 52px;
            font-size: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background: #fff;
            color: #222;
        }
        .pad button:active { background: #e8eeff; }
        @media (pointer: coarse) {
            .pad { display: grid; }
            .controls { display: none; }
        }
        @media (max-width: 480px) {
            .game { gap: 10px; }
            .side { width: 110px; gap: 8px; }
            .box { padding: 8px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>

<body>
    <h1>TETRIS</h1>
    <div class="game">
        <canvas id="board" width="300" height="600"></canvas>
        <div class="side">
            <div class="box">
                <h2>NEXT</h2>
                <canvas id="next" width="88" height="44"></canvas>
            </div>
            <div class="box">
                <h2>HOLD</h2>
                <canvas id="hold" width="88" height="44"></canvas>
            </div>
            <div class="box">
                <div class="stat"><span>점수</span><b id="score">0</b></div>
                <div class="stat"><span>줄</span><b id="lines">0</b></div>
                <div class="stat"><span>레벨</span><b id="level">1</b></div>
            </div>
            <div class="box controls">
                <h2>조작법</h2>
                <div><kbd>← →</kbd>좌우 이동</div>
                <div><kbd>↓</kbd>내리기</div>
                <div><kbd>↑ / X</kbd>회전</div>
                <div><kbd>Z</kbd>역회전</div>
                <div><kbd>Space</kbd>하드 드롭</div>
                <div><kbd>C</kbd>홀드</div>
                <div><kbd>P</kbd>일시정지</div>
                <div><kbd>R</kbd>재시작</div>
            </div>
        </div>
    </div>
    <div class="pad">
        <button data-act="hold">홀드</button>
        <button data-act="ccw">↺</button>
        <button data-act="cw">↻</button>
        <button data-act="pause">⏸</button>
        <button data-act="left">←</button>
        <button data-act="down">↓</button>
        <button data-act="right">→</button>
        <button data-act="drop">⤓</button>
    </div>

    <script>
        const COLS = 10, ROWS = 20, CELL = 30;
        const SHAPES = {
            I: [[0, 1], [1, 1], [2, 1], [3, 1]],
            O: [[1, 0], [2, 0], [1, 1], [2, 1]],
            T: [[1, 0], [0, 1], [1, 1], [2, 1]],
            S: [[1, 0], [2, 0], [0, 1], [1, 1]],
            Z: [[0, 0], [1, 0], [1, 1], [2, 1]],
            J: [[0, 0], [0, 1], [1, 1], [2, 1]],
            L: [[2, 0], [0, 1], [1, 1], [2, 1]],
        };
        const COLORS = {
            I: "#00c8ec", O: "#f5c800", T: "#a64dff", S: "#2fcc3e",
            Z: "#ff3b3b", J: "#3b6bff", L: "#ff9a1f",
        };
        const LINE_SCORES = { 1: 100, 2: 300, 3: 500, 4: 800 };
        const KICKS = [[0, 0], [-1, 0], [1, 0], [-2, 0], [2, 0], [0, -1]];

        const boardCtx = document.getElementById("board").getContext("2d");
        const nextCtx = document.getElementById("next").getContext("2d");
        const holdCtx = document.getElementById("hold").getContext("2d");
        const $ = id => document.getElementById(id);

        let board, bag, piece, nextKind, holdKind, canHold;
        let score, lines, level, paused, gameOver, dropTimer, lastTime;

        function newPiece(kind) {
            return { kind, cells: SHAPES[kind].map(c => [...c]), size: kind === "I" ? 4 : 3, x: 3, y: 0 };
        }

        function pull() {
            if (!bag.length) {
                bag = Object.keys(SHAPES);
                for (let i = bag.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [bag[i], bag[j]] = [bag[j], bag[i]];
                }
            }
            return bag.pop();
        }

        function reset() {
            board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
            bag = [];
            nextKind = pull();
            holdKind = null;
            canHold = true;
            score = 0; lines = 0; level = 1;
            paused = false; gameOver = false;
            dropTimer = 0;
            spawn();
        }

        function spawn(kind) {
            if (!kind) { kind = nextKind; nextKind = pull(); }
            piece = newPiece(kind);
            if (!fits(blocks(piece))) gameOver = true;
        }

        function blocks(p, cells = p.cells, dx = 0, dy = 0) {
            return cells.map(([x, y]) => [p.x + x + dx, p.y + y + dy]);
        }

        function fits(bs) {
            return bs.every(([x, y]) => x >= 0 && x < COLS && y < ROWS && (y < 0 || !board[y][x]));
        }

        function move(dx, dy) {
            if (fits(blocks(piece, piece.cells, dx, dy))) {
                piece.x += dx; piece.y += dy;
                return true;
            }
            return false;
        }

        function rotate(cw) {
            if (piece.kind === "O") return;
            const n = piece.size - 1;
            const cells = piece.cells.map(([x, y]) => cw ? [n - y, x] : [y, n - x]);
            for (const [dx, dy] of KICKS) {
                if (fits(blocks(piece, cells, dx, dy))) {
                    piece.cells = cells; piece.x += dx; piece.y += dy;
                    return;
                }
            }
        }

        function hardDrop() {
            let d = 0;
            while (move(0, 1)) d++;
            score += d * 2;
            lock();
        }

        function hold() {
            if (!canHold) return;
            const cur = piece.kind;
            if (holdKind === null) { holdKind = cur; spawn(); }
            else { const swap = holdKind; holdKind = cur; spawn(swap); }
            canHold = false;
        }

        function lock() {
            for (const [x, y] of blocks(piece)) {
                if (y < 0) { gameOver = true; return; }
                board[y][x] = COLORS[piece.kind];
            }
            let cleared = 0;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r].every(Boolean)) {
                    board.splice(r, 1);
                    board.unshift(Array(COLS).fill(null));
                    cleared++;
                    r++;
                }
            }
            if (cleared) {
                lines += cleared;
                score += LINE_SCORES[cleared] * level;
                level = Math.floor(lines / 10) + 1;
            }
            canHold = true;
            dropTimer = 0;
            spawn();
        }

        function ghostDy() {
            let dy = 0;
            while (fits(blocks(piece, piece.cells, 0, dy + 1))) dy++;
            return dy;
        }

        function interval() {
            return Math.max(80, 800 - (level - 1) * 70);
        }

        // ---------- 그리기 ----------
        function drawCell(ctx, x, y, color, size = CELL, ghost = false) {
            const px = x * size, py = y * size;
            if (ghost) {
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.strokeRect(px + 2, py + 2, size - 4, size - 4);
                return;
            }
            ctx.fillStyle = color;
            ctx.fillRect(px, py, size, size);
            ctx.strokeStyle = "rgba(0,0,0,0.25)";
            ctx.lineWidth = 1;
            ctx.strokeRect(px + 0.5, py + 0.5, size - 1, size - 1);
        }

        function drawPreview(ctx, kind) {
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            if (!kind) return;
            const size = 22;
            for (const [x, y] of SHAPES[kind]) drawCell(ctx, x, y, COLORS[kind], size);
        }

        function draw() {
            const ctx = boardCtx;
            ctx.fillStyle = "#fff";
            ctx.fillRect(0, 0, COLS * CELL, ROWS * CELL);
            ctx.strokeStyle = "#e3e3e3";
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = 1; x < COLS; x++) { ctx.moveTo(x * CELL + 0.5, 0); ctx.lineTo(x * CELL + 0.5, ROWS * CELL); }
            for (let y = 1; y < ROWS; y++) { ctx.moveTo(0, y * CELL + 0.5); ctx.lineTo(COLS * CELL, y * CELL + 0.5); }
            ctx.stroke();

            board.forEach((row, y) => row.forEach((c, x) => c && drawCell(ctx, x, y, c)));

            if (!gameOver) {
                const color = COLORS[piece.kind];
                const gy = ghostDy();
                for (const [x, y] of blocks(piece, piece.cells, 0, gy)) if (y >= 0) drawCell(ctx, x, y, color, CELL, true);
                for (const [x, y] of blocks(piece)) if (y >= 0) drawCell(ctx, x, y, color);
            }

            const midX = COLS * CELL / 2, midY = ROWS * CELL / 2;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            if (gameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.85)";
                ctx.fillRect(0, midY - 55, COLS * CELL, 110);
                ctx.fillStyle = "#ff4d4d";
                ctx.font = "bold 32px Consolas, monospace";
                ctx.fillText("GAME OVER", midX, midY - 14);
                ctx.fillStyle = "#fff";
                ctx.font = "15px 'Malgun Gothic', sans-serif";
                ctx.fillText("R 키 또는 화면을 눌러 재시작", midX, midY + 24);
            } else if (paused) {
                ctx.fillStyle = "rgba(255,255,255,0.8)";
                ctx.fillRect(0, 0, COLS * CELL, ROWS * CELL);
                ctx.fillStyle = "#222";
                ctx.font = "bold 32px Consolas, monospace";
                ctx.fillText("PAUSED", midX, midY);
            }

            drawPreview(nextCtx, nextKind);
            drawPreview(holdCtx, holdKind);
            $("score").textContent = score;
            $("lines").textContent = lines;
            $("level").textContent = level;
        }

        // ---------- 루프 / 입력 ----------
        function loop(time) {
            const dt = time - (lastTime ?? time);
            lastTime = time;
            if (!paused && !gameOver) {
                dropTimer += dt;
                if (dropTimer >= interval()) {
                    dropTimer = 0;
                    if (!move(0, 1)) lock();
                }
            }
            draw();
            requestAnimationFrame(loop);
        }

        function act(action) {
            if (action === "restart") { reset(); return; }
            if (gameOver) return;
            if (action === "pause") { paused = !paused; return; }
            if (paused) return;
            switch (action) {
                case "left": move(-1, 0); break;
                case "right": move(1, 0); break;
                case "down": if (move(0, 1)) { score += 1; dropTimer = 0; } break;
                case "cw": rotate(true); break;
                case "ccw": rotate(false); break;
                case "drop": hardDrop(); break;
                case "hold": hold(); break;
            }
        }

        const KEYMAP = {
            ArrowLeft: "left", ArrowRight: "right", ArrowDown: "down", ArrowUp: "cw",
            x: "cw", z: "ccw", " ": "drop", c: "hold", p: "pause", r: "restart",
        };
        document.addEventListener("keydown", e => {
            const action = KEYMAP[e.key.length === 1 ? e.key.toLowerCase() : e.key];
            if (!action) return;
            e.preventDefault();
            act(action);
        });

        document.querySelectorAll(".pad button").forEach(btn => {
            btn.addEventListener("pointerdown", e => {
                e.preventDefault();
                act(gameOver ? "restart" : btn.dataset.act);
            });
        });
        document.getElementById("board").addEventListener("pointerdown", () => {
            if (gameOver) reset();
        });

        reset();
        requestAnimationFrame(loop);
    </script>
</body>

</html>
